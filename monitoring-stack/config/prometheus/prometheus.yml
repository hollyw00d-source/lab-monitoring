global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          host: "monitoring-vm"

  # Proxmox host/VM stats via pve-exporter.
  # Replace 192.168.1.141 with your own Proxmox host IP.
  - job_name: "pve"
    static_configs:
      - targets: ["192.168.1.141:8006"]
    metrics_path: /pve
    params:
      module: [default]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: pve-exporter:9221

  # pfSense metrics via the Telegraf package (System > Package Manager on pfSense),
  # configured with a [[outputs.prometheus_client]] block listening on :9273.
  # NOTE: this is deliberately NOT node_exporter -- pfSense is FreeBSD-based and
  # can't run node_exporter, which is Linux-only. Telegraf is cross-platform and
  # has an official pfSense package, which is why the stack uses it here instead.
  # Replace 192.168.1.1 with your own pfSense IP.
  - job_name: "pfsense"
    static_configs:
      - targets: ["192.168.1.1:9273"]
