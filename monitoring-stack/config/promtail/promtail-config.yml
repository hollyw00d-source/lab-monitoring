server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Remote syslog from pfSense / Omada Controller / anything else, RELAYED via
  # rsyslog running on the host (see host-config/10-remote.conf).
  #
  # Why not Promtail's built-in `syslog` receiver? It only parses strict
  # RFC5424-formatted syslog. pfSense (and most consumer network gear) sends
  # classic RFC3164 ("BSD syslog"), which Promtail's parser rejects outright
  # with "expecting a version value in the range 1-999". Rather than fight
  # that, rsyslog sits in front, accepts either format, and writes plain log
  # files -- which Promtail then tails like any other file.
  - job_name: remote-syslog
    static_configs:
      - targets: ["localhost"]
        labels:
          job: remote_syslog
          __path__: /host/var/log/remote/*/syslog.log

  # Local system logs from this monitoring VM itself
  - job_name: local-syslog
    static_configs:
      - targets: ["localhost"]
        labels:
          job: varlogs
          host: monitoring-vm
          __path__: /host/var/log/*.log
