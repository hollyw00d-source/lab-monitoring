# /etc/rsyslog.d/10-remote.conf on the monitoring VM.
# NOT deployed by Docker Compose -- rsyslog runs directly on the host OS
# because it needs to own port 1514 outside of any container, so Promtail
# can read the plain files it produces instead of parsing syslog itself.
#
# To deploy: copy this file to /etc/rsyslog.d/10-remote.conf on the VM,
# then `sudo systemctl restart rsyslog`.

module(load="imudp")
module(load="imtcp")

$FileCreateMode 0644
$template RemoteLogs,"/var/log/remote/%HOSTNAME%/syslog.log"

# Bind the network listeners to their OWN ruleset, rather than the default
# one. Without this, a plain "*.* ?RemoteLogs" rule also captures the VM's
# own local system logs (journald/dockerd/kernel), mixing local noise in
# with actual remote device logs. Scoping it to a dedicated ruleset means
# only messages that arrive over the network on port 1514 ever hit this rule.
ruleset(name="remoteLogs") {
  *.* ?RemoteLogs
  stop
}

input(type="imudp" port="1514" ruleset="remoteLogs")
input(type="imtcp" port="1514" ruleset="remoteLogs")
